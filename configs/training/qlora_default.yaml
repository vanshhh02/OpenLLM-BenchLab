job_id: "qlora_qwen_billsum_run1"
base_model_id: "Qwen/Qwen2.5-0.5B-Instruct"
dataset_name: "billsum"
dataset_split_train: "train"
dataset_split_val: "ca_test"
output_dir: "artifacts/checkpoints/qlora_qwen2.5_0.5b"
lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  use_qlora: true
  quant_type: "nf4"
  use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"
learning_rate: 0.0002
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
num_train_epochs: 3
max_steps: -1
max_seq_length: 1024
warmup_ratio: 0.03
weight_decay: 0.01
logging_steps: 10
eval_steps: 50
save_steps: 50
save_total_limit: 2
mixed_precision: "bf16"
gradient_checkpointing: true
seed: 42

